<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Animacion panel general">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <style>
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; }
      .slide { animation: slide 2.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes slide { 0% { transform: translateX(0px); } 50% { transform: translateX(80px); } 100% { transform: translateX(0px);} }
    </style>
  </defs>
  <rect width="640" height="280" fill="url(#bg)"/>
  <rect x="24" y="24" width="592" height="232" rx="16" fill="#0a0a0a" stroke="#383838"/>
  <rect x="42" y="44" width="200" height="28" rx="8" fill="#202020"/>
  <rect class="pulse" x="50" y="50" width="78" height="16" rx="8" fill="#ef4444"/>
  <g class="slide">
    <rect x="280" y="48" width="90" height="20" rx="10" fill="#2a2a2a"/>
    <rect x="376" y="48" width="90" height="20" rx="10" fill="#2a2a2a"/>
    <rect x="472" y="48" width="90" height="20" rx="10" fill="#2a2a2a"/>
  </g>
  <rect x="44" y="92" width="552" height="144" rx="10" fill="#141414" stroke="#2b2b2b"/>
  <rect class="pulse" x="62" y="110" width="120" height="12" rx="6" fill="#ef4444"/>
  <rect x="62" y="132" width="250" height="8" rx="4" fill="#3a3a3a"/>
  <rect x="62" y="148" width="320" height="8" rx="4" fill="#323232"/>
  <rect x="62" y="164" width="290" height="8" rx="4" fill="#323232"/>
  <rect x="410" y="110" width="168" height="108" rx="8" fill="#191919" stroke="#353535"/>
  <rect class="pulse" x="428" y="130" width="70" height="10" rx="5" fill="#ef4444"/>
  <rect x="428" y="150" width="130" height="8" rx="4" fill="#3a3a3a"/>
</svg>
