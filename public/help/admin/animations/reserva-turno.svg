<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Animacion reserva turno">
  <defs>
    <style>
      .blink { animation: blink 1.4s ease-in-out infinite; }
      .fill { animation: fill 3s linear infinite; }
      @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes fill { 0% { width: 0; } 70% { width: 210px; } 100% { width: 210px; } }
    </style>
  </defs>
  <rect width="640" height="280" fill="#111"/>
  <rect x="34" y="30" width="572" height="220" rx="14" fill="#0d0d0d" stroke="#343434"/>
  <rect x="58" y="56" width="220" height="26" rx="8" fill="#1f1f1f"/>
  <rect class="blink" x="66" y="62" width="94" height="14" rx="7" fill="#ef4444"/>
  <g transform="translate(58,96)">
    <rect x="0" y="0" width="240" height="128" rx="10" fill="#171717" stroke="#2b2b2b"/>
    <rect x="14" y="14" width="64" height="18" rx="6" fill="#222"/>
    <rect x="14" y="42" width="210" height="66" rx="8" fill="#111" stroke="#2f2f2f"/>
    <rect class="fill" x="14" y="42" width="0" height="66" rx="8" fill="#ef444433"/>
  </g>
  <g transform="translate(320,96)">
    <rect x="0" y="0" width="262" height="128" rx="10" fill="#171717" stroke="#2b2b2b"/>
    <rect x="16" y="18" width="104" height="16" rx="8" fill="#ef4444" class="blink"/>
    <rect x="16" y="46" width="94" height="24" rx="8" fill="#1f1f1f"/>
    <rect x="118" y="46" width="94" height="24" rx="8" fill="#1f1f1f"/>
    <rect x="16" y="80" width="196" height="24" rx="8" fill="#242424"/>
  </g>
</svg>
