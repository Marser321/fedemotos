<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Animacion crear excepcion">
  <defs>
    <style>
      .tick { animation: tick 1.5s ease-in-out infinite; }
      .draw { stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw 2.4s ease-in-out infinite; }
      @keyframes tick { 0%,100% { opacity: .35;} 50% {opacity: 1;} }
      @keyframes draw { 0% { stroke-dashoffset: 160;} 50%,100% { stroke-dashoffset: 0;} }
    </style>
  </defs>
  <rect width="640" height="280" fill="#101010"/>
  <rect x="34" y="30" width="572" height="220" rx="14" fill="#121212" stroke="#333"/>
