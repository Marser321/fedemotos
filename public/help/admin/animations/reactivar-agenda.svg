<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Animacion reactivar agenda">
  <defs>
    <style>
      .ok { animation: ok 1.8s ease-in-out infinite; }
      .sweep { animation: sweep 2.5s ease-in-out infinite; }
      @keyframes ok { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
      @keyframes sweep { 0% { transform: translateX(-90px);} 100% { transform: translateX(390px);} }
    </style>
  </defs>
  <rect width="640" height="280" fill="#101010"/>
  <rect x="34" y="30" width="572" height="220" rx="14" fill="#121212" stroke="#333"/>
  <rect x="58" y="56" width="220" height="24" rx="8" fill="#202020"/>
  <rect x="58" y="96" width="524" height="128" rx="12" fill="#171717" stroke="#2f2f2f"/>
  <rect class="ok" x="78" y="116" width="190" height="18" rx="9" fill="#22c55e"/>
  <rect x="78" y="146" width="300" height="14" rx="7" fill="#203020"/>
  <rect class="sweep" x="78" y="146" width="90" height="14" rx="7" fill="#22c55e"/>
  <rect x="78" y="170" width="250" height="12" rx="6" fill="#2f3f2f"/>
  <rect x="78" y="190" width="210" height="12" rx="6" fill="#2f3f2f"/>
  <circle class="ok" cx="530" cy="160" r="30" fill="#22c55e33" stroke="#22c55e"/>
  <path d="M518 160l8 8 16-18" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
