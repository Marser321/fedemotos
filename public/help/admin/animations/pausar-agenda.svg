<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Animacion pausar agenda">
  <defs>
    <style>
      .warn { animation: warn 1.6s ease-in-out infinite; }
      .bar { animation: bar 2.2s ease-in-out infinite; }
      @keyframes warn { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
      @keyframes bar { 0% { width: 0; } 100% { width: 280px; } }
    </style>
  </defs>
  <rect width="640" height="280" fill="#0f0f0f"/>
  <rect x="34" y="30" width="572" height="220" rx="14" fill="#121212" stroke="#333"/>
  <rect x="58" y="56" width="220" height="24" rx="8" fill="#202020"/>
  <rect x="58" y="96" width="524" height="128" rx="12" fill="#171717" stroke="#2f2f2f"/>
  <rect class="warn" x="78" y="116" width="180" height="18" rx="9" fill="#eab308"/>
  <rect x="78" y="146" width="280" height="14" rx="7" fill="#2a2a2a"/>
  <rect class="bar" x="78" y="146" width="0" height="14" rx="7" fill="#ef4444"/>
  <rect x="78" y="170" width="230" height="12" rx="6" fill="#333"/>
  <rect x="78" y="190" width="190" height="12" rx="6" fill="#333"/>
  <circle class="warn" cx="530" cy="160" r="30" fill="#ef444433" stroke="#ef4444"/>
  <rect x="520" y="146" width="8" height="28" rx="3" fill="#ef4444"/>
  <rect x="534" y="146" width="8" height="28" rx="3" fill="#ef4444"/>
</svg>
